version: '3.8'

services:
  mysql:
    image: mysql:latest
    restart: always
    container_name: mysql-nlw
    environment:
      - MYSQL_ROOT_PASSWORD=mysql
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - nlw-network

volumes:
  mysql_data:

networks:
  nlw-network: